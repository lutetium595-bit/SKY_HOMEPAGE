.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.navbuttons,.views{display:flex;gap:6px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer}.btn.active{background:var(--accent);color:white;border-color:var(--accent)}.period{font-size:17px;font-weight:800;text-align:center;flex:1}
.calendar{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.weekdays,.monthgrid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{padding:11px 4px;text-align:center;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;overflow:hidden}.day:nth-child(7n){border-right:0}.muted{opacity:.38}.today .num{background:var(--accent);color:white}.num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:5px}.event{font-size:11px;padding:4px 6px;border-radius:5px;margin:3px 0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.방송{background:#78a9dc}.게임{background:#9b91d5}.소통{background:#72bda1}.휴방{background:#b9a36f}.기타{background:#8995a5}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{border-right:1px solid var(--line);min-height:430px}.weekday:last-child{border-right:0}.whead{padding:12px;text-align:center;border-bottom:1px solid var(--line);font-weight:700}.wbody{padding:8px}.weekempty{text-align:center;padding:80px 10px;color:var(--sub);font-size:13px}
.admin{margin-top:16px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.admin h3{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);font:inherit}.form textarea{grid-column:1/-1;min-height:80px}.full{grid-column:1/-1}.adminrow{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.footer{text-align:center;color:var(--sub);font-size:11px;margin-top:35px}
@media(max-width:700px){header{height:58px;padding:0 11px}.wrap{padding-top:25px}.hero h1{font-size:24px}.day{min-height:85px;padding:5px}.event{font-size:9px;padding:3px 4px}.num{width:23px;height:23px}.weekgrid{display:block}.weekday{min-height:auto;border-right:0;border-bottom:1px solid var(--line)}.weekday:last-child{border-bottom:0}.wbody{padding:5px}.form{grid-template-columns:1fr}.full,.form textarea{grid-column:auto}.period{order:-1;width:100%;flex-basis:100%}}

<script>
(function(){
  var KEYS = ["gaksky_calendar_shared_v1", "skyCalendarEvents", "sky_notice_data", "skyDresses", "skyUpboItems"];
  var API = '/api/data/';
  var PASSWORD = 'soopgodsky221010><';

  // Load the latest shared data before each page's existing scripts run.
  KEYS.forEach(function(key){
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', API + encodeURIComponent(key), false);
      xhr.send(null);
      if (xhr.status === 200) {
        var result = JSON.parse(xhr.responseText);
        if (result && result.exists) {
          localStorage.setItem(key, JSON.stringify(result.value));
        }
      }
    } catch (e) {
      // If the server is temporarily unavailable, keep the existing local data.
    }
  });

  // Keep the existing pages unchanged: intercept only their existing data saves
  // and mirror them to PostgreSQL.
  var originalSetItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, value){
    originalSetItem.call(this, key, value);

    if (this !== localStorage || KEYS.indexOf(key) === -1) return;

    // Existing pages already require admin mode before editing.
    // Only administrator saves are sent to the shared database.
    if (localStorage.getItem('sky_day_shared_admin') !== '1') return;

    try {
      var xhr = new XMLHttpRequest();
      xhr.open('PUT', API + encodeURIComponent(key), true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('x-admin-password', PASSWORD);
      xhr.send(JSON.stringify({ value: JSON.parse(value) }));
    } catch (e) {
      console.warn('공용 저장에 실패했습니다.', e);
    }
  };

  // Other open pages refresh when a shared update is announced.
  setInterval(function(){
    KEYS.forEach(function(key){
      try {
        fetch(API + encodeURIComponent(key), { cache:'no-store' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(result){
            if (!result || !result.exists) return;
            var next = JSON.stringify(result.value);
            if (localStorage.getItem(key) !== next) {
              originalSetItem.call(localStorage, key, next);
              window.dispatchEvent(new StorageEvent('storage', {
                key:key, newValue:next, storageArea:localStorage
              }));
            }
          })
          .catch(function(){});
      } catch(e) {}
    });
  }, 10000);
})();
</script>

<script>
const $=s=>document.querySelector(s), body=document.body;


function getDateValue(){ return $("#date").value; }
function getEndValue(){ return $("#end").value; }
function setDateValue(v){ $("#date").value=v||""; }
function setEndValue(v){ $("#end").value=v||""; }

const adminBtnTop=$("#adminBtn"), adminDrawer=$("#adminDrawer");
adminBtnTop.onclick=(e)=>{
  e.stopPropagation();
  adminDrawer.classList.toggle("show");
};
document.addEventListener("click",e=>{
  if(!adminDrawer) return;
  if(adminDrawer.contains(e.target)) return;
  if(adminBtnTop.contains(e.target)) return;
  adminDrawer.classList.remove("show");
});

let events=JSON.parse(localStorage.getItem("skyCalendarEvents")||"[]"), current=new Date(), view="month";
if(localStorage.getItem("skyTheme")==="dark"){body.classList.add("dark");$("#theme").textContent="☾"}
$("#theme").onclick=()=>{body.classList.toggle("dark");let d=body.classList.contains("dark");$("#theme").textContent=d?"☾":"☼";localStorage.setItem("skyTheme",d?"dark":"light")};
$("#hamb").onclick=()=>$("#menu").classList.toggle("show");
document.addEventListener("click",e=>{if(!$("#menu").contains(e.target)&&e.target!==$("#hamb"))$("#menu").classList.remove("show")});
const pad=n=>String(n).padStart(2,"0"), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function render(){view==="month"?renderMonth():renderWeek();renderAdmin();document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view))}
function renderMonth(){
  const y=current.getFullYear(),m=current.getMonth();
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  let rows=[];

  for(let w=0;w<6;w++){
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(start);
      d.setDate(start.getDate()+w*7+i);
      days.push(d);
    }

    const htmlDays=days.map(d=>`<div class="day ${d.getMonth()!=m?"muted":""} ${iso(d)===iso(new Date())?"today":""}">
      <div class="num">${d.getDate()}</div>
    </div>`).join("");

    // 일정의 위치는 실제 날짜를 기준으로 고정한다.
    // 같은 날짜/겹치는 날짜 일정만 다음 줄을 사용한다.
    const occupied=[];
    let maxRows=0;
    let bars="";

    const weekEvents=events.filter(e=>{
      const es=new Date(e.date+"T00:00:00");
      const ee=new Date((e.end||e.date)+"T00:00:00");
      return !(ee<days[0] || es>days[6]);
    });

    weekEvents.forEach(e=>{
      const es=new Date(e.date+"T00:00:00");
      const ee=new Date((e.end||e.date)+"T00:00:00");
      const ws=days[0],we=days[6];

      const segStart=es<ws?ws:es;
      const segEnd=ee>we?we:ee;
      const s=Math.max(0,Math.floor((segStart-ws)/86400000));
      const en=Math.min(6,Math.floor((segEnd-ws)/86400000));
      const width=en-s+1;

      let row=0;
      while(true){
        if(!occupied[row]) occupied[row]=Array(7).fill(false);
        let free=true;
        for(let c=s;c<=en;c++){
          if(occupied[row][c]){free=false;break;}
        }
        if(free)break;
        row++;
      }
      for(let c=s;c<=en;c++)occupied[row][c]=true;
      maxRows=Math.max(maxRows,row+1);

      const left=s*(100/7);
      const widthPct=width*(100/7);
      const top=39+row*24;
      const title=(es.getTime()===segStart.getTime()
        ? ((e.time?e.time+" ":"")+e.title)
        : "↳ "+e.title);

      bars+=`<div class="event-bar ${e.cat}" data-event-id="${e.id}" style="position:absolute;left:calc(${left}% + 2px);width:calc(${widthPct}% - 4px);top:${top}px" title="${esc(e.detail)}">${esc(title)}</div>`;
    });

    // 일정 수만큼 이 주간 행의 높이만 증가시킨다.
    // 다른 날짜의 일정은 절대로 아래로 밀리지 않는다.
    const rowHeight=Math.max(112,39+(maxRows*24)+8);

    rows.push(`<div class="month-week" style="height:${rowHeight}px;min-height:${rowHeight}px">
      <div class="month-days" style="height:${rowHeight}px;min-height:${rowHeight}px">${htmlDays}</div>
      <div class="event-bars" style="height:${rowHeight}px">${bars}</div>
    </div>`);
  }

  $("#period").textContent=`${y}년 ${m+1}월`;
  $("#calendarBody").innerHTML=rows.join("");
}

function renderWeek(){
let d=new Date(current), dow=d.getDay(), start=new Date(d);start.setDate(d.getDate()-dow);let end=new Date(start);end.setDate(start.getDate()+6);
$("#period").textContent=`${start.getFullYear()}년 ${start.getMonth()+1}월 ${start.getDate()}일 ~ ${end.getMonth()+1}월 ${end.getDate()}일`;
let cells=[];for(let i=0;i<7;i++){let x=new Date(start);x.setDate(start.getDate()+i);let ev=events.filter(e=>iso(x)>=e.date&&iso(x)<=(e.end||e.date));cells.push(`<div class="weekday"><div class="whead">${["일","월","화","수","목","금","토"][i]} ${x.getMonth()+1}/${x.getDate()}</div><div class="wbody">${ev.length?ev.map(e=>`<div class="event ${e.cat}" data-event-id="${e.id}">${e.time?e.time+" ":""}${esc(e.title)}</div>`).join(""):"<div class='weekempty'>일정 없음</div>"}</div></div>`)}$("#calendarBody").innerHTML=`<div class="weekgrid">${cells.join("")}</div>`;
}

    id:editingEventId||Date.now(),

    time:$("#time").value,
    cat:$("#cat").value,
    title:$("#title").value,

<!-- SKY-DAY SHARED THEME SYNC FINAL -->
<script>
(function(){
  var KEY = 'SKY_DAY_GLOBAL_THEME';

  function getTheme(){
    return localStorage.getItem(KEY) === 'dark' ? 'dark' : 'light';
  }

  function apply(theme){
    var isDark = theme === 'dark';
    if (document.body) document.body.classList.toggle('dark', isDark);

    var btn = document.getElementById('themeBtn');
    if(btn){
      btn.textContent = isDark ? '☾' : '☼';
      btn.title = isDark ? '라이트모드' : '다크모드';
      btn.setAttribute('aria-label', btn.title);
    }
  }

  function setTheme(theme){
    localStorage.setItem(KEY, theme);
    apply(theme);
  }

  function bind(){
    apply(getTheme());

    var btn = document.getElementById('themeBtn');
    if(!btn || btn.dataset.sharedThemeSync === '1') return;
    btn.dataset.sharedThemeSync = '1';

    // Capture phase: run before each page's original click handler.
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopImmediatePropagation();

      var next = document.body.classList.contains('dark') ? 'light' : 'dark';
      setTheme(next);
    }, true);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', bind);
  }else{
    bind();
  }

  window.addEventListener('storage', function(e){
    if(e.key === KEY) apply(getTheme());
  });
})();
</script>
<!-- SKY-DAY SHARED THEME STORAGE V3 -->
<script>
(function(){
 var SHARED='sky-day-shared-theme';
 var originalGet=Storage.prototype.getItem, originalSet=Storage.prototype.setItem;
 var aliases=['theme','darkMode','dark-mode','mode','SKY_DAY_GLOBAL_THEME','skyTheme','sky-day-theme'];
 function alias(k){return aliases.indexOf(String(k))!==-1||String(k)===SHARED;}
 function valid(v){return v==='light'||v==='dark';}
 var current=originalGet.call(localStorage,SHARED);
 if(!valid(current)) originalSet.call(localStorage,SHARED,'light');

 Storage.prototype.getItem=function(k){
  if(alias(k)){var v=originalGet.call(this,SHARED);return valid(v)?v:'light';}
  return originalGet.call(this,k);
 };
 Storage.prototype.setItem=function(k,v){
  if(alias(k)){return originalSet.call(this,SHARED,valid(v)?v:'light');}
  return originalSet.call(this,k,v);
 };

 function applyShared(){
  var t=originalGet.call(localStorage,SHARED);
  t=valid(t)?t:'light';
  if(typeof window.setTheme==='function'){try{window.setTheme(t);return;}catch(e){}}
  if(typeof window.apply==='function'){try{window.apply(t);return;}catch(e){}}
 }
 document.addEventListener('DOMContentLoaded',function(){
  applyShared();
  window.addEventListener('pageshow',applyShared);
  window.addEventListener('storage',function(e){if(e.key===SHARED&&valid(e.newValue))applyShared();});
 });
})();
</script>

<!-- SKY-DAY COMMON ADMIN MODE V1 -->
<script>
(function(){
  var KEY='sky_day_shared_admin';

  function isAdmin(){
    return localStorage.getItem(KEY)==='1';
  }

  // If another page logs in/out while this page is open, refresh the page's own
  // existing admin UI without changing its design or management functions.
  window.addEventListener('storage',function(e){
    if(e.key===KEY) window.location.reload();
  });

  window.addEventListener('pageshow',function(){
    // Existing pages keep their own show/hide logic. A reload is only needed when
    // a bfcache-restored page has stale admin UI after navigating from another page.
    if(performance && performance.getEntriesByType){
      var nav=performance.getEntriesByType('navigation')[0];
      if(nav && nav.type==='back_forward') window.location.reload();
    }
  });
})();
</script>
