<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKY - DAY | 업보목록</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#ffffff;--soft:#edf2f8;--line:#dce4ef;
  --text:#243047;--sub:#7d8aa0;--accent:#6f8fbd;--accent2:#9fb7d9;
  --danger:#c96d79;--shadow:0 12px 30px rgba(40,60,90,.10);
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
body.dark{
  --bg:#18243a;--panel:#223149;--soft:#263750;--line:#3a4e6b;
  --text:#f3f6fb;--sub:#aebbd0;--accent:#9fb7d9;--accent2:#7f9ac0;
  --shadow:0 14px 35px rgba(0,0,0,.28);
}
.topbar{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1050px)/2));position:sticky;top:0;z-index:20}
body.dark .topbar{background:#263752;border-color:#3a4e6b}
.logo{font-size:18px;font-weight:800;letter-spacing:1px}.actions{display:flex;gap:8px}
.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;cursor:pointer}
.icon-btn{width:40px;height:40px;font-size:19px}.btn{padding:10px 14px;font-size:13px;font-weight:700}
.icon-btn:hover,.btn:hover{background:var(--soft)}
.wrap{max-width:1050px;margin:0 auto;padding:32px 18px 45px}
.hero{margin-bottom:24px}.hero h1{margin:0;font-size:30px}.hero p{color:var(--sub);margin:8px 0 0;font-size:14px}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}
.filter{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--sub);cursor:pointer;font-size:12px}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:24px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:24px 16px 22px;min-height:250px;box-shadow:var(--shadow);
  cursor:pointer;transition:.18s;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center
}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.upbo-icon{
  width:100px;height:100px;border-radius:50%;display:grid;place-items:center;
  background:var(--soft);border:3px solid var(--line);font-size:40px;
  margin-bottom:16px;overflow:hidden
}
.upbo-icon img{width:100%;height:100%;object-fit:cover}
.num{font-size:11px;color:var(--sub);letter-spacing:1px;margin-bottom:4px}
.name{font-size:20px;font-weight:800;margin:3px 0 14px;word-break:keep-all}
.upbo-count{
  margin-top:auto;padding:8px 16px;border-radius:999px;
  background:#f1b72b22;color:#e2ad27;font-size:15px;font-weight:800
}
body.dark .upbo-count{background:#342a20;color:#f1c442}
.desc{display:none}.meta{display:none}.badge{display:none}
@media(max-width:1000px){.list{grid-template-columns:repeat(4,minmax(150px,1fr))}}
@media(max-width:760px){.list{grid-template-columns:repeat(3,minmax(130px,1fr));gap:14px}.card{min-height:210px;padding:18px 10px}.upbo-icon{width:78px;height:78px;font-size:32px}.name{font-size:17px}}
@media(max-width:480px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:18px}
footer{text-align:center;color:var(--sub);font-size:11px;margin-top:40px}
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.52);opacity:0;pointer-events:none;transition:.2s;z-index:50}.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;width:min(430px,100%);height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:60;transform:translateX(105%);transition:.25s;padding:22px;overflow:auto}.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer h2{font-size:20px;margin:0}.close{font-size:22px;border:0;background:transparent;color:var(--text);cursor:pointer}
.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}.field textarea{min-height:100px;resize:vertical}
.form-actions{display:flex;gap:8px;margin-top:15px}.primary{background:var(--accent);border-color:var(--accent);color:white}.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.admin-list{margin-top:25px;border-top:1px solid var(--line);padding-top:18px}.admin-item{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.grow{flex:1;min-width:0}.admin-item b{font-size:13px}.small{padding:7px 9px;font-size:11px}
.modal{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:70;opacity:0;pointer-events:none;transition:.2s}.modal.show{opacity:1;pointer-events:auto}.modal-box{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);position:relative}.modal-box h2{margin:0 0 10px}.modal-box p{color:var(--sub);line-height:1.7;font-size:14px}.modal-close{position:absolute;right:15px;top:12px}
.menu{position:absolute;width:190px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:7px;z-index:40;display:none}.menu.show{display:block}.menu a{display:block;padding:12px;border-radius:10px;text-decoration:none;color:var(--text);font-size:13px}.menu a:hover{background:var(--soft)}
@media(max-width:600px){.wrap{padding-top:24px}.hero h1{font-size:25px}.toolbar{align-items:flex-start;flex-direction:column}.list{grid-template-columns:1fr}}
</style>

<script>
(function(){
  var KEYS = ["gaksky_calendar_shared_v1", "skyCalendarEvents", "sky_notice_data", "skyDresses", "skyUpboItems"];
  var API = '/api/data/';
  var PASSWORD = 'soopgodsky221010><';

  // Load the latest shared data before each page's existing scripts run.
  KEYS.forEach(function(key){
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', API + encodeURIComponent(key), false);
      xhr.send(null);
      if (xhr.status === 200) {
        var result = JSON.parse(xhr.responseText);
        if (result && result.exists) {
          localStorage.setItem(key, JSON.stringify(result.value));
        }
      }
    } catch (e) {
      // If the server is temporarily unavailable, keep the existing local data.
    }
  });

  // Keep the existing pages unchanged: intercept only their existing data saves
  // and mirror them to PostgreSQL.
  var originalSetItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, value){
    originalSetItem.call(this, key, value);

    if (this !== localStorage || KEYS.indexOf(key) === -1) return;

    // Existing pages already require admin mode before editing.
    // Only administrator saves are sent to the shared database.
    if (localStorage.getItem('sky_day_shared_admin') !== '1') return;

    try {
      var xhr = new XMLHttpRequest();
      xhr.open('PUT', API + encodeURIComponent(key), true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('x-admin-password', PASSWORD);
      xhr.send(JSON.stringify({ value: JSON.parse(value) }));
    } catch (e) {
      console.warn('공용 저장에 실패했습니다.', e);
    }
  };

  // Other open pages refresh when a shared update is announced.
  setInterval(function(){
    KEYS.forEach(function(key){
      try {
        fetch(API + encodeURIComponent(key), { cache:'no-store' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(result){
            if (!result || !result.exists) return;
            var next = JSON.stringify(result.value);
            if (localStorage.getItem(key) !== next) {
              originalSetItem.call(localStorage, key, next);
              window.dispatchEvent(new StorageEvent('storage', {
                key:key, newValue:next, storageArea:localStorage
              }));
            }
          })
          .catch(function(){});
      } catch(e) {}
    });
  }, 10000);
})();
</script>

<script>
const $=s=>document.querySelector(s);
let items=JSON.parse(localStorage.getItem("skyUpboItems")||"[]");
let filter="전체", editingId=null;
const save=()=>localStorage.setItem("skyUpboItems",JSON.stringify(items));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function badgeClass(s){return s==="완료"?"done":s==="진행중"?"progress":"pending"}
function render(){
 const view=filter==="전체"?items:items.filter(x=>x.status===filter);
 $("#countText").textContent=`총 ${view.length}개`;
 $("#list").innerHTML=view.length?view.map((x,i)=>`<article class="card" data-id="${x.id}">
   <div class="upbo-icon">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}" onerror="this.remove();this.parentElement.textContent='☁';">`:"☁"}</div>
   <div class="num">UPBO · ${String(items.indexOf(x)+1).padStart(2,"0")}</div>
   <div class="name">${esc(x.name)}</div>
   <div class="upbo-count">업보 ${Number(x.count ?? 0)}</div>
 </article>`).join(""):`<div class="empty">등록된 업보가 없습니다.</div>`;
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
 if(localStorage.getItem("sky_day_shared_admin")==="1") renderAdmin();
}
function openDetail(id){
 const x=items.find(v=>String(v.id)===String(id)); if(!x)return;
 $("#mNum").textContent="UPBO";
 $("#mName").textContent=x.name;
 $("#mStatus").textContent=x.status; $("#mStatus").className="badge "+badgeClass(x.status);
 $("#mDesc").textContent=x.desc||"등록된 업보 내용이 없습니다.";
 $("#mDate").textContent=x.date||"날짜 미정";
 $("#modal").classList.add("show");
}
function renderAdmin(){
 const box=$("#adminList");
 box.innerHTML=items.length?items.map(x=>`<div class="admin-item">
   <div class="grow"><b>${esc(x.name)}</b><div style="font-size:11px;color:var(--sub);margin-top:3px">${esc(x.status)} · 업보 ${Number(x.count ?? 0)} · ${esc(x.desc||"내용 없음")}</div></div>
   <button class="btn small edit" data-id="${x.id}" type="button">수정</button>
   <button class="btn small danger del" data-id="${x.id}" type="button">삭제</button>
 </div>`).join(""):`<div style="font-size:12px;color:var(--sub);padding:10px 0">등록된 업보가 없습니다.</div>`;
 box.querySelectorAll(".edit").forEach(b=>b.onclick=()=>{
   const x=items.find(v=>String(v.id)===String(b.dataset.id)); if(!x)return;
   editingId=x.id; $("#name").value=x.name; $("#image").value=x.image||""; $("#count").value=x.count??0; $("#status").value=x.status; $("#date").value=x.date||""; $("#desc").value=x.desc||"";
   $("#saveBtn").textContent="업보 수정"; $("#drawer").classList.add("show");
 });
 box.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
   const x=items.find(v=>String(v.id)===String(b.dataset.id)); if(!x)return;
   if(!confirm(`"${x.name}" 업보를 삭제할까요?`))return;
   items=items.filter(v=>String(v.id)!==String(x.id)); save(); render();
   $("#drawer").classList.add("show"); $("#adminBox").style.display="block"; $("#loginBox").style.display="none";
 });
}
$("#form").onsubmit=e=>{
 e.preventDefault();
 const data={name:$("#name").value.trim(),image:$("#image").value.trim(),count:Math.max(0,Number($("#count").value||0)),status:$("#status").value,date:$("#date").value,desc:$("#desc").value.trim()};
 if(!data.name)return;
 if(editingId){const x=items.find(v=>String(v.id)===String(editingId));Object.assign(x,data)}
 else items.unshift({id:Date.now()+"_"+Math.random().toString(16).slice(2),...data});
 save(); editingId=null; e.target.reset(); $("#saveBtn").textContent="업보 등록"; render();
 $("#drawer").classList.add("show"); $("#adminBox").style.display="block"; $("#loginBox").style.display="none";
};
$("#cancelBtn").onclick=()=>{editingId=null;$("#form").reset();$("#saveBtn").textContent="업보 등록";$("#drawer").classList.add("show")};
$("#filters").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()};
$("#themeBtn").onclick=()=>{document.body.classList.toggle("dark");const d=document.body.classList.contains("dark");$("#themeBtn").textContent=d?"☾":"☼";localStorage.setItem("skyUpboTheme",d?"dark":"light")};
if(localStorage.getItem("skyUpboTheme")==="dark"){document.body.classList.add("dark");$("#themeBtn").textContent="☾"}
$("#menuBtn").onclick=(e)=>{
  const menu=$("#menu");
  const btn=$("#menuBtn");
  const r=btn.getBoundingClientRect();
  const willOpen=!menu.classList.contains("show");
  if(!willOpen){menu.classList.remove("show");return}
  menu.style.top=(r.bottom+8)+"px";
  menu.style.left=(r.right-menu.offsetWidth)+"px";
  menu.style.right="auto";
  menu.classList.add("show");
  requestAnimationFrame(()=>{
    menu.style.left=(r.right-menu.offsetWidth)+"px";
  });
};
document.addEventListener("click",e=>{if(!e.target.closest("#menuBtn")&&!e.target.closest("#menu"))$("#menu").classList.remove("show")});
$("#adminBtn").onclick=()=>{$("#drawer").classList.add("show");$("#overlay").classList.add("show");if(localStorage.getItem("sky_day_shared_admin")==="1"){$("#loginBox").style.display="none";$("#adminBox").style.display="block";renderAdmin()}};
function closeDrawer(){$("#drawer").classList.remove("show");$("#overlay").classList.remove("show")}
$("#closeDrawer").onclick=closeDrawer;$("#overlay").onclick=closeDrawer;
$("#loginBtn").onclick=()=>{if($("#password").value===window.__SKY_DAY_ADMIN_PASSWORD__()){localStorage.setItem("sky_day_shared_admin","1");$("#loginBox").style.display="none";$("#adminBox").style.display="block";renderAdmin()}else alert("비밀번호가 올바르지 않습니다.")};
$("#closeModal").onclick=()=>$("#modal").classList.remove("show");
$("#modal").onclick=e=>{if(e.target===$("#modal"))$("#modal").classList.remove("show")};
render();
</script>

<!-- SKY-DAY SHARED THEME SYNC FINAL -->
<script>
(function(){
  var KEY = 'SKY_DAY_GLOBAL_THEME';

  function getTheme(){
    return localStorage.getItem(KEY) === 'dark' ? 'dark' : 'light';
  }

  function apply(theme){
    var isDark = theme === 'dark';
    if (document.body) document.body.classList.toggle('dark', isDark);

    var btn = document.getElementById('themeBtn');
    if(btn){
      btn.textContent = isDark ? '☾' : '☼';
      btn.title = isDark ? '라이트모드' : '다크모드';
      btn.setAttribute('aria-label', btn.title);
    }
  }

  function setTheme(theme){
    localStorage.setItem(KEY, theme);
    apply(theme);
  }

  function bind(){
    apply(getTheme());

    var btn = document.getElementById('themeBtn');
    if(!btn || btn.dataset.sharedThemeSync === '1') return;
    btn.dataset.sharedThemeSync = '1';

    // Capture phase: run before each page's original click handler.
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopImmediatePropagation();

      var next = document.body.classList.contains('dark') ? 'light' : 'dark';
      setTheme(next);
    }, true);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', bind);
  }else{
    bind();
  }

  window.addEventListener('storage', function(e){
    if(e.key === KEY) apply(getTheme());
  });
})();
</script>
<!-- SKY-DAY SHARED THEME STORAGE V3 -->
<script>
(function(){
 var SHARED='sky-day-shared-theme';
 var originalGet=Storage.prototype.getItem, originalSet=Storage.prototype.setItem;
 var aliases=['theme','darkMode','dark-mode','mode','SKY_DAY_GLOBAL_THEME','skyTheme','sky-day-theme'];
 function alias(k){return aliases.indexOf(String(k))!==-1||String(k)===SHARED;}
 function valid(v){return v==='light'||v==='dark';}
 var current=originalGet.call(localStorage,SHARED);
 if(!valid(current)) originalSet.call(localStorage,SHARED,'light');

 Storage.prototype.getItem=function(k){
  if(alias(k)){var v=originalGet.call(this,SHARED);return valid(v)?v:'light';}
  return originalGet.call(this,k);
 };
 Storage.prototype.setItem=function(k,v){
  if(alias(k)){return originalSet.call(this,SHARED,valid(v)?v:'light');}
  return originalSet.call(this,k,v);
 };

 function applyShared(){
  var t=originalGet.call(localStorage,SHARED);
  t=valid(t)?t:'light';
  if(typeof window.setTheme==='function'){try{window.setTheme(t);return;}catch(e){}}
  if(typeof window.apply==='function'){try{window.apply(t);return;}catch(e){}}
 }
 document.addEventListener('DOMContentLoaded',function(){
  applyShared();
  window.addEventListener('pageshow',applyShared);
  window.addEventListener('storage',function(e){if(e.key===SHARED&&valid(e.newValue))applyShared();});
 });
})();
</script>

<!-- SKY-DAY COMMON ADMIN MODE V1 -->
<script>
(function(){
  var KEY='sky_day_shared_admin';

  function isAdmin(){
    return localStorage.getItem(KEY)==='1';
  }

  // If another page logs in/out while this page is open, refresh the page's own
  // existing admin UI without changing its design or management functions.
  window.addEventListener('storage',function(e){
    if(e.key===KEY) window.location.reload();
  });

  window.addEventListener('pageshow',function(){
    // Existing pages keep their own show/hide logic. A reload is only needed when
    // a bfcache-restored page has stale admin UI after navigating from another page.
    if(performance && performance.getEntriesByType){
      var nav=performance.getEntriesByType('navigation')[0];
      if(nav && nav.type==='back_forward') window.location.reload();
    }
  });
})();
</script>
